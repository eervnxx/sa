<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        :root {
            --bg: #0f1119;
            --bg-card: #1a1d28;
            --bg-input: #232734;
            --text: #e4e6f0;
            --text2: #a0a3b1;
            --accent: #4f8cff;
            --green: #34c759;
            --orange: #ff9f0a;
            --red: #ff453a;
            --border: #2a2d3a;
            --radius: 10px;
        }

        body.light {
            --bg: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #e8ecf1;
            --text: #1a1c2e;
            --text2: #555770;
            --border: #dde0e8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .login-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-overlay.hidden { display: none; }
        
        .login-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; padding: 40px 35px; width: 380px; text-align: center;
        }
        .login-box .icon { font-size: 45px; margin-bottom: 12px; }
        .login-box h1 { font-size: 22px; margin-bottom: 4px; }
        .login-box p { color: var(--text2); font-size: 14px; margin-bottom: 22px; }
        .login-box input {
            width: 100%; padding: 14px; background: var(--bg-input);
            border: 2px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: 'Cairo', sans-serif;
            font-size: 17px; text-align: center; letter-spacing: 3px; outline: none;
        }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button {
            width: 100%; padding: 13px; background: var(--accent); color: #fff;
            border: none; border-radius: var(--radius);
            font-family: 'Cairo', sans-serif; font-size: 17px; font-weight: 700;
            cursor: pointer; margin-top: 12px;
        }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; }

        .app { display: flex; min-height: 100vh; }
        .app.hidden { display: none; }

        .sidebar {
            width: 220px; background: var(--bg-card); border-left: 1px solid var(--border);
            position: fixed; top: 0; right: 0; bottom: 0; z-index: 100;
            display: flex; flex-direction: column; padding: 14px 8px;
        }
        .sidebar-header { text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        .sidebar-header .logo { font-size: 32px; }
        .sidebar-header h3 { font-size: 15px; margin: 3px 0; }
        .sidebar-header span { font-size: 11px; color: var(--text2); }
        
        .sidebar-nav { flex: 1; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            color: var(--text2); text-decoration: none; border-radius: var(--radius);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 2px;
        }
        .sidebar-nav a:hover { background: var(--bg-input); color: var(--text); }
        .sidebar-nav a.active { background: rgba(79,140,255,0.15); color: var(--accent); }
        
        .sidebar-footer { border-top: 1px solid var(--border); padding-top: 8px; }
        .sidebar-footer a {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            color: var(--red); text-decoration: none; border-radius: var(--radius);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .sidebar-footer a:hover { background: rgba(255,69,58,0.1); }

        .main-content { flex: 1; margin-right: 220px; padding: 25px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { margin-bottom: 20px; }
        .page-header h2 { font-size: 24px; font-weight: 800; }

        .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .table-toolbar {
            display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
            border-bottom: 1px solid var(--border); align-items: center;
        }
        .table-toolbar input, .table-toolbar select {
            padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 14px; outline: none;
        }
        .table-toolbar input:focus, .table-toolbar select:focus { border-color: var(--accent); }
        .table-toolbar input { flex: 1; min-width: 150px; }
        .table-toolbar select { min-width: 120px; }

        .btn {
            padding: 9px 16px; border: none; border-radius: 8px;
            font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .btn-blue { background: var(--accent); color: #fff; }
        .btn-blue:hover { opacity: 0.85; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-orange { background: var(--orange); color: #000; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-outline:hover { background: var(--bg-input); color: var(--text); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }
        .btn-preview { background: #6366f1; color: #fff; }
        .btn-preview:hover { opacity: 0.85; }
        .btn-reset { background: #f59e0b; color: #000; }
        .btn-reset:hover { opacity: 0.85; }
        .btn-logout-all { background: #ef4444; color: #fff; }
        .btn-logout-all:hover { opacity: 0.85; }
        .btn-block { width: 100%; padding: 12px; font-size: 15px; margin-top: 8px; }

        table { width: 100%; border-collapse: collapse; }
        table thead th {
            background: var(--bg-input); color: var(--accent);
            font-size: 13px; font-weight: 700; padding: 12px 10px;
            border-bottom: 2px solid var(--border); text-align: center;
        }
        table tbody td {
            padding: 12px 10px; border-bottom: 1px solid var(--border);
            font-size: 14px; text-align: center; font-weight: 600;
        }
        table tbody tr:hover { background: rgba(79,140,255,0.05); }
        table tbody td:first-child { color: var(--text2); font-size: 12px; }

        td.editable { cursor: pointer; transition: background 0.2s; border-radius: 4px; }
        td.editable:hover { background: rgba(79,140,255,0.1); }
        td.editable input {
            width: 100%; padding: 6px 8px; background: var(--bg-input); border: 2px solid var(--accent);
            border-radius: 6px; color: var(--text); font-family: 'Cairo', sans-serif;
            font-size: 14px; text-align: center; outline: none; font-weight: 600;
        }

        .table-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-top: 1px solid var(--border);
            font-size: 14px; font-weight: 700; flex-wrap: wrap; gap: 8px;
        }
        .table-footer .total { color: var(--accent); font-size: 18px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 24px; width: 460px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { font-size: 20px; text-align: center; margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 14px; }
        .modal .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
            width: 100%; padding: 12px 14px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 15px; outline: none;
            transition: border-color 0.2s;
        }
        .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { border-color: var(--accent); }
        .modal .form-group input.error { border-color: var(--red); animation: shake 0.5s ease; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }

        .toast {
            position: fixed; bottom: 25px; left: 25px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px;
            z-index: 300; font-size: 14px; font-weight: 600;
        }
        .toast.success { border-right: 4px solid var(--green); }
        .toast.error { border-right: 4px solid var(--red); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
        .stat-card .stat-icon { font-size: 26px; margin-bottom: 6px; }
        .stat-card .stat-value { font-size: 24px; font-weight: 800; }
        .stat-card .stat-label { font-size: 12px; color: var(--text2); margin-top: 3px; }

        .theme-toggle {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px; background: var(--bg-input); border-radius: var(--radius);
            cursor: pointer; font-size: 16px; font-weight: 700; transition: 0.2s; border: 2px solid var(--border);
        }
        .theme-toggle:hover { border-color: var(--accent); }
        .theme-toggle .icon { font-size: 26px; }

        .chart-container {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-top: 16px;
        }
        .chart-container canvas { width: 100% !important; max-height: 300px; }

        .preview-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 400;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .preview-overlay.active { opacity: 1; visibility: visible; }
        .preview-window {
            background: #fff; width: 95vw; height: 90vh; border-radius: 14px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .preview-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0;
        }
        .preview-header h3 { font-family: 'Cairo', sans-serif; font-size: 18px; color: #333; margin: 0; }
        .preview-header .btn-group { display: flex; gap: 8px; }
        .preview-header .btn-print { background: #4f8cff; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; }
        .preview-header .btn-close { background: #6b7280; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; }
        .preview-body {
            flex: 1; overflow-y: auto; padding: 16px; background: #e8e8e8;
            display: flex; justify-content: center;
        }
        /* ✅ تم تكبير جميع خطوط الطباعة */
        .preview-page {
            width: 210mm; min-height: 297mm; background: #fff;
            padding: 10mm; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-family: 'Simplified Arabic', 'Traditional Arabic', 'Tahoma', serif;
            color: #000; font-size: 15px;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .preview-page .p-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 14px; }
        .preview-page .p-header h2 { font-size: 22px; margin-bottom: 4px; font-weight: bold; }
        .preview-page .p-header h3 { font-size: 18px; color: #444; }
        .preview-page .p-header p { font-size: 12px; color: #666; }
        .preview-page table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
        .preview-page th { background: #e0e0e0; border: 1px solid #bbb; padding: 8px 6px; text-align: center; font-weight: bold; font-size: 12px; }
        .preview-page td { border: 1px solid #ccc; padding: 7px 6px; text-align: center; font-size: 13px; }
        .preview-page tr:nth-child(even) td { background: #f5f5f5; }
        .preview-page tr.total-row td {
            background: #d0d0d0 !important; font-weight: bold; font-size: 14px;
            border-top: 2px solid #333;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .preview-page .p-footer { text-align: center; margin-top: 15px; font-size: 11px; color: #999; border-top: 1px solid #ddd; padding-top: 6px; }

        .password-warning {
            background: var(--warning-light); border: 1px solid var(--orange);
            border-radius: 8px; padding: 10px 14px; font-size: 12px;
            color: var(--orange); margin-top: 6px; text-align: center;
        }
        .settings-divider { border-top: 1px solid var(--border); margin: 16px 0; padding-top: 16px; }
        .settings-label { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 8px; text-align: center; }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .table-toolbar { flex-direction: column; align-items: stretch; }
        }

        @media print {
            body * { visibility: hidden; }
            .preview-window, .preview-window * { visibility: visible; }
            .preview-window { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
            .preview-header { display: none; }
            .preview-body { padding: 0; background: #fff; }
            .preview-page { box-shadow: none; width: 100%; min-height: auto; padding: 5mm; }
        }
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div class="icon">📊</div>
        <h1>نظام إدارة الحسابات</h1>
        <p>أدخل كلمة المرور للمتابعة</p>
        <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
        <button id="loginBtn">🔐 دخول</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<div class="app hidden" id="appLayout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">📊</div>
            <h3 id="companyNameDisplay">شركتي</h3>
            <span id="companyCurrency">د.ع</span>
        </div>
        <nav class="sidebar-nav">
            <a data-page="salaries" class="active"><span>💳</span> الرواتب</a>
            <a data-page="employees"><span>👥</span> الموظفون</a>
            <a data-page="expenses"><span>💸</span> المصاريف</a>
            <a data-page="revenues"><span>💰</span> الإيرادات</a>
            <a data-page="management"><span>📋</span> الإدارة</a>
            <a data-page="analytics"><span>📊</span> التحليل</a>
            <a data-page="settings"><span>⚙️</span> الإعدادات</a>
        </nav>
        <div class="sidebar-footer"><a id="logoutBtn"><span>🚪</span> خروج</a></div>
    </aside>
    <main class="main-content" id="mainContent">
        <div class="page active" id="page-salaries"></div>
        <div class="page" id="page-employees"></div>
        <div class="page" id="page-expenses"></div>
        <div class="page" id="page-revenues"></div>
        <div class="page" id="page-management"></div>
        <div class="page" id="page-analytics"></div>
        <div class="page" id="page-settings"></div>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast" style="display:none;"></div>
<div class="preview-overlay" id="previewOverlay">
    <div class="preview-window" id="previewWindow">
        <div class="preview-header">
            <h3>📄 معاينة قبل الطباعة</h3>
            <div class="btn-group">
                <button class="btn-print" onclick="printDirect()">🖨️ طباعة</button>
                <button class="btn-close" onclick="closePreview()">✕ إغلاق</button>
            </div>
        </div>
        <div class="preview-body"><div class="preview-page" id="previewContent"></div></div>
    </div>
</div>

<script>
// ==================== إعدادات Firebase ====================
const firebaseConfig = {
  apiKey: "AIzaSyD7r_fU9w6jXwH_RPFOF4_twEfqY6AiVDc",
  authDomain: "system-bng.firebaseapp.com",
  projectId: "system-bng",
  storageBucket: "system-bng.firebasestorage.app",
  messagingSenderId: "708060887067",
  appId: "1:708060887067:web:bf840832ecc52d7f5160be",
  measurementId: "G-C86GMBN7RV"
};

const DEFAULT_PASSWORD = '7788c';

let db, currentUser = null, currentPage = 'salaries';
let companySettings = { name: 'شركتي', currency: 'د.ع', theme: 'dark' };
let currentMonth = new Date().getMonth() + 1, currentYear = new Date().getFullYear();
let salariesData = [], salariesFiltered = [];
let employeesData = [], employeesFiltered = [];
let expensesData = [], expensesFiltered = [];
let revenuesData = [], revenuesFiltered = [];
let managementFY = getFinancialYear(new Date().toISOString().split('T')[0]);
let analyticsChart = null;
let savedPassword = DEFAULT_PASSWORD;

function fmoney(num) { if (num === null || num === undefined || isNaN(num)) return '0'; return Number(num).toLocaleString('en-US'); }
function fcurrency(num) { return fmoney(num) + ' ' + companySettings.currency; }
function today() { return new Date().toISOString().split('T')[0]; }
function dateF() { const d = new Date(); return d.toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' }); }
function getFinancialYear(ds) { if(!ds) return ''; const d=new Date(ds); const y=d.getFullYear(),m=d.getMonth()+1; return m>=7?`${y}-${y+1}`:`${y-1}-${y}`; }
function getFYRange(l) { const y=parseInt(l.split('-')[0]); return {start:`${y}-07-01`,end:`${y+1}-06-30`}; }
function monthOpts(sel=null){ let o=''; for(let i=1;i<=12;i++){ const s=(sel!==null&&i===sel)?'selected':(sel===null&&i===currentMonth?'selected':''); o+=`<option value="${i}" ${s}>${i}</option>`; } return o; }
function yearOpts(sel=null){ let o=''; const cy=new Date().getFullYear(),cm=new Date().getMonth()+1,sy=cm>=7?cy:cy-1; for(let y=2026;y<=2040;y++){ const l=`${y}-${y+1}`,s=(sel===l)?'selected':((y===sy&&!sel)?'selected':''); o+=`<option value="${l}" ${s}>${l}</option>`; } return o; }
function toast(msg,type='success'){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast '+type; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2500); }
function modal(title,html,onSave){ const ov=document.getElementById('modalOverlay'),mc=document.getElementById('modalContent'); mc.innerHTML=`<h3>${title}</h3><div>${html}</div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button><button class="btn btn-blue" id="modalSaveBtn">حفظ</button></div>`; ov.classList.add('active'); if(onSave) document.getElementById('modalSaveBtn').addEventListener('click',async()=>{await onSave();}); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function confirmDel(msg){ return new Promise(r=>{ const ov=document.getElementById('modalOverlay'),mc=document.getElementById('modalContent'); mc.innerHTML=`<h3>⚠️ تأكيد الحذف</h3><p style="text-align:center;font-size:16px;margin:16px 0;">${msg}</p><div class="modal-actions"><button class="btn btn-outline" id="cn">إلغاء</button><button class="btn btn-red" id="cy">تأكيد</button></div>`; ov.classList.add('active'); document.getElementById('cy').addEventListener('click',()=>{ov.classList.remove('active');r(true);}); document.getElementById('cn').addEventListener('click',()=>{ov.classList.remove('active');r(false);}); }); }

function shakeField(fieldId) { const el = document.getElementById(fieldId); if (!el) return; el.classList.add('error'); el.focus(); setTimeout(() => el.classList.remove('error'), 600); }

async function addDoc(c,d){ return await db.collection(c).add({...d,created_at:firebase.firestore.FieldValue.serverTimestamp()}); }
async function updDoc(c,id,d){ await db.collection(c).doc(id).update(d); }
async function delDoc(c,id){ await db.collection(c).doc(id).delete(); }
async function getDocs(c,ob=null,dir='asc'){ let q=db.collection(c); if(ob) q=q.orderBy(ob,dir); const s=await q.get(),d=[]; s.forEach(x=>d.push({id:x.id,...x.data()})); return d; }

let autoSaveTimeout;
function autoSaveSettings(){ clearTimeout(autoSaveTimeout); autoSaveTimeout=setTimeout(async()=>{if(!db)return;try{const s=await getDocs('settings');if(s.length>0)await updDoc('settings',s[0].id,{settings:companySettings});else await addDoc('settings',{settings:companySettings});}catch(e){}},500); }

async function loadPasswordFromDB() { if (!db) return; try { const s = await getDocs('settings'); if (s.length > 0 && s[0].password) { savedPassword = s[0].password; } else { savedPassword = DEFAULT_PASSWORD; } } catch (e) { savedPassword = DEFAULT_PASSWORD; } }
async function savePasswordToDB(newPassword) { if (!db) return; try { const s = await getDocs('settings'); if (s.length > 0) { await updDoc('settings', s[0].id, { password: newPassword }); } else { await addDoc('settings', { password: newPassword, settings: companySettings }); } savedPassword = newPassword; } catch (e) { toast('خطأ في حفظ كلمة المرور', 'error'); } }
async function resetPasswordToDefault() { if (!db) { toast('قاعدة البيانات غير متصلة', 'error'); return; } const confirmed = await confirmDel('هل أنت متأكد من استعادة كلمة المرور الافتراضية؟\n\nسيتم حذف كلمة المرور الحالية والعودة إلى: ' + DEFAULT_PASSWORD); if (!confirmed) return; try { const s = await getDocs('settings'); if (s.length > 0) { await updDoc('settings', s[0].id, { password: DEFAULT_PASSWORD }); } else { await addDoc('settings', { password: DEFAULT_PASSWORD, settings: companySettings }); } savedPassword = DEFAULT_PASSWORD; toast('✅ تم استعادة كلمة المرور الافتراضية: ' + DEFAULT_PASSWORD); } catch (e) { toast('خطأ', 'error'); } }
async function logoutAllUsers() { const confirmed = await confirmDel('⚠️ تحذير: سيتم إلغاء جميع تسجيلات الدخول النشطة!\n\nسيضطر جميع المستخدمين إلى إعادة تسجيل الدخول.\n\nهل تريد المتابعة؟'); if (!confirmed) return; localStorage.removeItem('acc_auth'); currentUser = null; document.getElementById('loginOverlay').classList.remove('hidden'); document.getElementById('appLayout').classList.add('hidden'); document.getElementById('passwordInput').value = ''; toast('✅ تم إلغاء جميع تسجيلات الدخول بنجاح'); }

function checkAuth(){ if(localStorage.getItem('acc_auth')==='true'){ document.getElementById('loginOverlay').classList.add('hidden'); document.getElementById('appLayout').classList.remove('hidden'); initApp(); } }
async function login(){ const pw=document.getElementById('passwordInput').value; if(pw===savedPassword){ localStorage.setItem('acc_auth','true'); currentUser={id:1}; document.getElementById('loginOverlay').classList.add('hidden'); document.getElementById('appLayout').classList.remove('hidden'); document.getElementById('loginError').textContent=''; await initApp(); toast('✅ تم تسجيل الدخول بنجاح'); } else { document.getElementById('loginError').textContent='❌ كلمة المرور غير صحيحة'; document.getElementById('passwordInput').value=''; document.getElementById('passwordInput').focus(); } }
function logout(){ localStorage.removeItem('acc_auth'); currentUser=null; document.getElementById('loginOverlay').classList.remove('hidden'); document.getElementById('appLayout').classList.add('hidden'); document.getElementById('passwordInput').value=''; }

function goTo(page){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active')); const el=document.getElementById('page-'+page); if(el) el.classList.add('active'); const nl=document.querySelector(`.sidebar-nav a[data-page="${page}"]`); if(nl) nl.classList.add('active'); currentPage=page; loadPage(page); }
function loadPage(p){ switch(p){ case 'salaries':loadSalaries();break; case 'employees':loadEmployees();break; case 'expenses':loadExpenses();break; case 'revenues':loadRevenues();break; case 'management':loadManagement();break; case 'analytics':loadAnalytics();break; case 'settings':loadSettings();break; } }
function initFirebase(){ try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.firestore(); return true; }catch(e){return false;} }
async function initApp(){ if(!initFirebase()){ toast('⚠️ فشل اتصال Firebase','error'); return; } await loadPasswordFromDB(); try{ const d=await getDocs('settings'); if(d.length>0&&d[0].settings) companySettings={...companySettings,...d[0].settings}; document.getElementById('companyNameDisplay').textContent=companySettings.name; document.getElementById('companyCurrency').textContent=companySettings.currency; if(companySettings.theme==='light') document.body.classList.add('light'); else document.body.classList.remove('light'); }catch(e){} managementFY = getFinancialYear(today()); goTo('salaries'); }

function getCurrentSalMonth() { return parseInt(document.getElementById('salMonth')?.value) || currentMonth; }
function getCurrentSalYear() { const yl = document.getElementById('salYear')?.value || ''; return yl ? parseInt(yl.split('-')[0]) : currentYear; }

function makeEditable(cell, type, id, field, currentValue) { cell.classList.add('editable'); cell.addEventListener('dblclick', function() { if (cell.querySelector('input')) return; const rawValue = type==='salary'||type==='transport' ? fmoney(currentValue) : currentValue; cell.innerHTML = `<input type="${type==='salary'||type==='transport'?'number':'text'}" value="${rawValue.replace(/,/g,'')}" step="0.001" style="width:100%">`; const inp = cell.querySelector('input'); inp.focus(); inp.select(); const save = async () => { let newVal = inp.value.trim(); if (type==='salary'||type==='transport') { newVal = parseFloat(newVal) || 0; if (newVal === 0 && currentValue !== 0) { cell.textContent = fmoney(currentValue); return; } } try { await updDoc('salaries', id, { [field]: newVal }); toast('✅ تم التحديث'); await fetchSalaries(); } catch(e) { cell.textContent = fmoney(currentValue); toast('خطأ', 'error'); } }; inp.addEventListener('blur', save); inp.addEventListener('keypress', e => { if (e.key === 'Enter') { inp.blur(); } }); }); }

// ==================== 💳 الرواتب ====================
async function loadSalaries(){ const c=document.getElementById('page-salaries'),fy=getFinancialYear(today()); c.innerHTML=`<div class="page-header"><h2>💳 الرواتب</h2></div><div class="table-card"><div class="table-toolbar"><input type="text" id="salSearch" placeholder="🔍 بحث..."><select id="salMonth">${monthOpts(currentMonth)}</select><select id="salYear">${yearOpts(fy)}</select><button class="btn btn-blue" onclick="openSalaryModal()">➕ إضافة</button><button class="btn btn-green" onclick="importAllEmp()">👥 استيراد</button><button class="btn btn-orange" onclick="copyPrevMonth()">📋 نسخ السابق</button><button class="btn btn-outline" onclick="exportExcel('salaries')">📥 Excel</button><button class="btn btn-preview" onclick="openPreview('salaries')">📄 معاينة</button></div><table><thead><tr><th>#</th><th>الموظف</th><th>الراتب</th><th>المواصلات</th><th>التاريخ</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody id="salBody"><tr><td colspan="7">جاري التحميل...</td></tr></tbody></table><div class="table-footer"><span>عدد: <strong id="salCount">0</strong></span><span>الرواتب: <strong id="salTotal1">0</strong></span><span>المواصلات: <strong id="salTotal2">0</strong></span><span class="total">الإجمالي: <strong id="salGrand">0</strong></span></div></div>`; document.getElementById('salSearch').addEventListener('input',filterSalaries); document.getElementById('salMonth').addEventListener('change',filterSalaries); document.getElementById('salYear').addEventListener('change',filterSalaries); await fetchSalaries(); }
async function fetchSalaries(){ if(!db)return; salariesData=await getDocs('salaries','date'); filterSalaries(); }
function filterSalaries(){ let f=[...salariesData]; const s=document.getElementById('salSearch')?.value?.toLowerCase()||'',m=parseInt(document.getElementById('salMonth')?.value)||0,y=document.getElementById('salYear')?.value||''; if(s) f=f.filter(e=>(e.employee_name||'').toLowerCase().includes(s)); if(m) f=f.filter(e=>e.month==m); if(y){const r=getFYRange(y); f=f.filter(e=>e.date>=r.start&&e.date<=r.end);} salariesFiltered=f; renderSalaries(); }
function renderSalaries(){ const tb=document.getElementById('salBody'),ts=salariesFiltered.reduce((a,e)=>a+Number(e.salary||0),0),tt=salariesFiltered.reduce((a,e)=>a+Number(e.transport||0),0); if(salariesFiltered.length===0){ tb.innerHTML='<tr><td colspan="7" style="padding:30px;">لا توجد سجلات</td></tr>'; } else { tb.innerHTML=salariesFiltered.map((e,i)=>`<tr><td>${i+1}</td><td><strong>${e.employee_name||'-'}</strong></td><td class="editable" data-id="${e.id}" data-field="salary" data-val="${e.salary||0}">${fcurrency(e.salary)}</td><td class="editable" data-id="${e.id}" data-field="transport" data-val="${e.transport||0}">${fcurrency(e.transport)}</td><td>${e.date||'-'}</td><td>${e.notes||'-'}</td><td><button class="btn btn-orange btn-sm" onclick="openSalaryModal('${e.id}')">✏️</button><button class="btn btn-red btn-sm" onclick="deleteSalary('${e.id}')">🗑️</button></td></tr>`).join(''); document.querySelectorAll('#salBody td.editable').forEach(td => { const id = td.dataset.id, field = td.dataset.field, val = parseFloat(td.dataset.val)||0; makeEditable(td, field==='salary'?'salary':'transport', id, field, val); }); } document.getElementById('salCount').textContent=salariesFiltered.length; document.getElementById('salTotal1').textContent=fcurrency(ts); document.getElementById('salTotal2').textContent=fcurrency(tt); document.getElementById('salGrand').textContent=fcurrency(ts+tt); }
async function openSalaryModal(id=null){ let rec={employee_name:'',salary:'',transport:'',date:today(),month:getCurrentSalMonth(),notes:''}; if(id) rec=salariesData.find(e=>e.id===id)||rec; modal(id?'✏️ تعديل راتب':'➕ إضافة راتب',`<div class="form-group"><label>الموظف *</label><input type="text" id="snm" value="${rec.employee_name}"></div><div class="form-group"><label>الراتب *</label><input type="number" id="ssal" value="${rec.salary}" step="0.001"></div><div class="form-group"><label>المواصلات</label><input type="number" id="str" value="${rec.transport}" step="0.001"></div><div class="form-group"><label>التاريخ</label><input type="date" id="sdt" value="${rec.date}"></div><div class="form-group"><label>ملاحظات</label><textarea id="snt" rows="2">${rec.notes||''}</textarea></div>`,async()=>{ const nm=document.getElementById('snm').value.trim(),sal=parseFloat(document.getElementById('ssal').value)||0,tr=parseFloat(document.getElementById('str').value)||0,dt=document.getElementById('sdt').value,nt=document.getElementById('snt').value.trim(); const mn=getCurrentSalMonth(); if(!nm||sal<=0){ toast('يرجى تعبئة الحقول المطلوبة','error'); return; } try{ if(id){ await updDoc('salaries',id,{employee_name:nm,salary:sal,transport:tr,date:dt,month:mn,notes:nt}); } else { await addDoc('salaries',{employee_name:nm,salary:sal,transport:tr,date:dt,month:mn,notes:nt}); } closeModal(); await fetchSalaries(); toast(id?'تم التعديل ✓':'تمت الإضافة ✓'); } catch(e){ toast('خطأ في الحفظ','error'); } }); }
async function deleteSalary(id){ const r=salariesData.find(e=>e.id===id); if(!await confirmDel(`حذف راتب ${r?.employee_name}؟`))return; try{await delDoc('salaries',id);await fetchSalaries();toast('تم الحذف ✓');}catch(e){toast('خطأ','error');} }
async function importAllEmp(){ if(!db)return; const selMonth = getCurrentSalMonth(); const emps=await getDocs('employees'),active=emps.filter(e=>e.status==='نشط'); if(active.length===0){toast('لا يوجد موظفون نشطون','error');return;} const exist=salariesData.filter(s=>s.month==selMonth).map(s=>s.employee_name); let cnt=0; for(const e of active){ if(exist.includes(e.name))continue; await addDoc('salaries',{employee_name:e.name,salary:e.default_salary||0,transport:e.default_transport||0,date:today(),month:selMonth,notes:''}); cnt++; } if(cnt===0){toast('جميع الموظفين النشطين مضافين مسبقاً','error');return;} toast(`✅ تم استيراد ${cnt} موظف`); await fetchSalaries(); }
async function copyPrevMonth(){ const selMonth = getCurrentSalMonth(), selYear = getCurrentSalYear(); let pm=selMonth-1, py=selYear; if(pm<1){pm=12;py--;} const allSalaries=await getDocs('salaries'); const prev=allSalaries.filter(s=>s.month==pm && s.date && s.date.startsWith(String(py))); if(prev.length===0){toast(`لا توجد بيانات للشهر ${pm}`,'error');return;} const exist=salariesData.filter(s=>s.month==selMonth).map(s=>s.employee_name); let cnt=0; for(const s of prev){ if(exist.includes(s.employee_name))continue; await addDoc('salaries',{employee_name:s.employee_name,salary:s.salary,transport:s.transport,date:today(),month:selMonth,notes:s.notes||''}); cnt++; } if(cnt===0){toast('جميع موظفي الشهر السابق مضافين مسبقاً','error');return;} toast(`✅ تم نسخ ${cnt} سجل`); await fetchSalaries(); }

async function loadEmployees(){ const c=document.getElementById('page-employees'); c.innerHTML=`<div class="page-header"><h2>👥 الموظفون</h2></div><div class="table-card"><div class="table-toolbar"><input type="text" id="empSearch" placeholder="🔍 بحث..."><select id="empStatus"><option value="">الكل</option><option value="نشط">نشط</option><option value="موقوف">موقوف</option></select><button class="btn btn-blue" onclick="openEmployeeModal()">➕ إضافة</button><button class="btn btn-outline" onclick="exportExcel('employees')">📥 Excel</button><button class="btn btn-preview" onclick="openPreview('employees')">📄 معاينة</button></div><table><thead><tr><th>#</th><th>الاسم</th><th>المنصب</th><th>الراتب</th><th>المواصلات</th><th>الهاتف</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="empBody"><tr><td colspan="8">جاري التحميل...</td></tr></tbody></table><div class="table-footer"><span>عدد: <strong id="empCount">0</strong></span><span style="color:var(--green)">نشط: <strong id="empActive">0</strong></span><span style="color:var(--red)">موقوف: <strong id="empInactive">0</strong></span></div></div>`; document.getElementById('empSearch').addEventListener('input',filterEmployees); document.getElementById('empStatus').addEventListener('change',filterEmployees); await fetchEmployees(); }
async function fetchEmployees(){ if(!db)return; employeesData=await getDocs('employees','name'); filterEmployees(); }
function filterEmployees(){ let f=[...employeesData]; const s=document.getElementById('empSearch')?.value?.toLowerCase()||'',st=document.getElementById('empStatus')?.value||''; if(s) f=f.filter(e=>(e.name||'').toLowerCase().includes(s)||(e.phone||'').includes(s)); if(st) f=f.filter(e=>e.status===st); employeesFiltered=f; renderEmployees(); }
function renderEmployees(){ const tb=document.getElementById('empBody'); if(employeesFiltered.length===0){ tb.innerHTML='<tr><td colspan="8">لا يوجد موظفون</td></tr>'; } else { tb.innerHTML=employeesFiltered.map((e,i)=>`<tr><td>${i+1}</td><td><strong>${e.name||'-'}</strong></td><td>${e.position||'-'}</td><td>${fcurrency(e.default_salary)}</td><td>${fcurrency(e.default_transport)}</td><td>${e.phone||'-'}</td><td style="color:${e.status==='نشط'?'var(--green)':'var(--red)'}">● ${e.status||'-'}</td><td><button class="btn btn-orange btn-sm" onclick="openEmployeeModal('${e.id}')">✏️</button><button class="btn btn-red btn-sm" onclick="deleteEmployee('${e.id}')">🗑️</button></td></tr>`).join(''); } document.getElementById('empCount').textContent=employeesFiltered.length; document.getElementById('empActive').textContent=employeesFiltered.filter(e=>e.status==='نشط').length; document.getElementById('empInactive').textContent=employeesFiltered.filter(e=>e.status==='موقوف').length; }
async function openEmployeeModal(id=null){ let rec={name:'',position:'',default_salary:'',default_transport:'',phone:'',status:'نشط',notes:''}; if(id) rec=employeesData.find(e=>e.id===id)||rec; modal(id?'✏️ تعديل موظف':'➕ إضافة موظف',`<div class="form-group"><label>الاسم *</label><input type="text" id="enm" value="${rec.name}"></div><div class="form-group"><label>المنصب</label><input type="text" id="eps" value="${rec.position||''}"></div><div class="form-group"><label>الراتب *</label><input type="number" id="esal" value="${rec.default_salary}" step="0.001"></div><div class="form-group"><label>المواصلات</label><input type="number" id="etr" value="${rec.default_transport}" step="0.001"></div><div class="form-group"><label>الهاتف</label><input type="text" id="eph" value="${rec.phone||''}"></div><div class="form-group"><label>الحالة</label><select id="est"><option value="نشط" ${rec.status==='نشط'?'selected':''}>نشط</option><option value="موقوف" ${rec.status==='موقوف'?'selected':''}>موقوف</option></select></div><div class="form-group"><label>ملاحظات</label><textarea id="ent" rows="2">${rec.notes||''}</textarea></div>`,async()=>{ const nm=document.getElementById('enm').value.trim(),ps=document.getElementById('eps').value.trim(),sal=parseFloat(document.getElementById('esal').value)||0,tr=parseFloat(document.getElementById('etr').value)||0,ph=document.getElementById('eph').value.trim(),st=document.getElementById('est').value,nt=document.getElementById('ent').value.trim(); if(!nm||sal<=0){ toast('يرجى تعبئة الحقول المطلوبة','error'); return; } try{ if(id){ await updDoc('employees',id,{name:nm,position:ps,default_salary:sal,default_transport:tr,phone:ph,status:st,notes:nt}); } else { await addDoc('employees',{name:nm,position:ps,default_salary:sal,default_transport:tr,phone:ph,status:st,notes:nt}); } closeModal(); await fetchEmployees(); toast(id?'تم التعديل ✓':'تمت الإضافة ✓'); } catch(e){ toast('خطأ','error'); } }); }
async function deleteEmployee(id){ if(!await confirmDel('حذف الموظف؟'))return; try{await delDoc('employees',id);await fetchEmployees();toast('تم الحذف ✓');}catch(e){toast('خطأ','error');} }

async function fetchRevenues(){ if(!db)return; revenuesData=await getDocs('revenues','date'); filterRevenues(); }
function filterRevenues(){ let f=[...revenuesData]; const s=document.getElementById('revSearch')?.value?.toLowerCase()||'',m=parseInt(document.getElementById('revMonth')?.value)||0,y=document.getElementById('revYear')?.value||''; if(s) f=f.filter(e=>(e.type||'').toLowerCase().includes(s)||String(e.amount||'').includes(s)||(e.receipt||'').toLowerCase().includes(s)); if(m) f=f.filter(e=>new Date(e.date).getMonth()+1===m); if(y){const r=getFYRange(y); f=f.filter(e=>e.date>=r.start&&e.date<=r.end);} revenuesFiltered=f; renderRevenues(); }
function renderRevenues(){ const tb=document.getElementById('revBody'),t=revenuesFiltered.reduce((a,e)=>a+Number(e.amount||0),0); if(revenuesFiltered.length===0){ tb.innerHTML='<tr><td colspan="7">لا توجد إيرادات</td></tr>'; } else { tb.innerHTML=revenuesFiltered.map((e,i)=>`<tr><td>${i+1}</td><td>${e.date||'-'}</td><td><strong>${e.receipt||'-'}</strong></td><td><strong>${fcurrency(e.amount)}</strong></td><td>${e.type||'-'}</td><td>${e.notes||'-'}</td><td><button class="btn btn-orange btn-sm" onclick="openRevenueModal('${e.id}')">✏️</button><button class="btn btn-red btn-sm" onclick="deleteRevenue('${e.id}')">🗑️</button></td></tr>`).join(''); } document.getElementById('revCount').textContent=revenuesFiltered.length; document.getElementById('revTotal').textContent=fcurrency(t); }
async function openRevenueModal(id=null){ let rec={date:today(),receipt:'',amount:'',type:'',notes:''}; if(id) rec=revenuesData.find(e=>e.id===id)||rec; modal(id?'✏️ تعديل إيراد':'➕ إضافة إيراد',`<div class="form-group"><label>التاريخ</label><input type="date" id="rdt" value="${rec.date}"></div><div class="form-group"><label>رقم الإيصال <span style="color:var(--red)">*</span></label><input type="text" id="rrc" value="${rec.receipt||''}" placeholder="أدخل رقم الإيصال (إجباري)"></div><div class="form-group"><label>المبلغ <span style="color:var(--red)">*</span></label><input type="number" id="ram" value="${rec.amount}" step="0.001"></div><div class="form-group"><label>النوع (اختياري)</label><input type="text" id="rtp" value="${rec.type||''}" placeholder="مبيعات، خدمات، إيجار..."></div><div class="form-group"><label>ملاحظات</label><textarea id="rnt" rows="2">${rec.notes||''}</textarea></div>`,async()=>{ const dt=document.getElementById('rdt').value,rc=document.getElementById('rrc').value.trim(),am=parseFloat(document.getElementById('ram').value)||0,tp=document.getElementById('rtp').value.trim(),nt=document.getElementById('rnt').value.trim(); if(!rc){ shakeField('rrc'); toast('❌ رقم الإيصال مطلوب','error'); return; } if(!dt||am<=0){ toast('يرجى تعبئة الحقول المطلوبة','error'); return; } try{ if(id){ await updDoc('revenues',id,{date:dt,receipt:rc,amount:am,type:tp,notes:nt}); } else { await addDoc('revenues',{date:dt,receipt:rc,amount:am,type:tp,notes:nt}); } closeModal(); await fetchRevenues(); toast(id?'تم التعديل ✓':'تمت الإضافة ✓'); } catch(e){ toast('خطأ','error'); } }); }
async function deleteRevenue(id){ if(!await confirmDel('حذف الإيراد؟'))return; try{await delDoc('revenues',id);await fetchRevenues();toast('تم الحذف ✓');}catch(e){toast('خطأ','error');} }

// ==================== 📋 الإدارة ====================
async function loadManagement(){ const c=document.getElementById('page-management'); c.innerHTML=`<div class="page-header"><h2>📋 الإدارة</h2></div><div class="table-toolbar" style="margin-bottom:16px;border:1px solid var(--border);border-radius:14px;padding:12px 16px;background:var(--bg-card);"><label style="font-size:15px;font-weight:700;">📅 السنة المالية:</label><select id="mgmtFYSelect" onchange="changeManagementFY()">${yearOpts(managementFY)}</select><button class="btn btn-preview" onclick="openPreview('management')">📄 معاينة</button></div><div class="stats-grid" id="mgmtStats">جاري التحميل...</div>`; await refreshManagement(); }
async function changeManagementFY(){ managementFY = document.getElementById('mgmtFYSelect').value; await refreshManagement(); }
async function refreshManagement(){ if(!db)return; const rng=getFYRange(managementFY); const [ex,rv,sl,em]=await Promise.all([getDocs('expenses'),getDocs('revenues'),getDocs('salaries'),getDocs('employees')]); const te=ex.filter(e=>e.date>=rng.start&&e.date<=rng.end).reduce((a,e)=>a+Number(e.amount||0),0),tr=rv.filter(e=>e.date>=rng.start&&e.date<=rng.end).reduce((a,e)=>a+Number(e.amount||0),0),ts=sl.filter(e=>e.date>=rng.start&&e.date<=rng.end).reduce((a,e)=>a+Number(e.salary||0)+Number(e.transport||0),0),pf=tr-te-ts,ac=em.filter(e=>e.status==='نشط').length; document.getElementById('mgmtStats').innerHTML=`<div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value">${fcurrency(tr)}</div><div class="stat-label">الإيرادات</div></div><div class="stat-card"><div class="stat-icon">💸</div><div class="stat-value">${fcurrency(te)}</div><div class="stat-label">المصاريف</div></div><div class="stat-card"><div class="stat-icon">💳</div><div class="stat-value">${fcurrency(ts)}</div><div class="stat-label">الرواتب</div></div><div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" style="color:${pf>=0?'var(--green)':'var(--red)'}">${fcurrency(pf)}</div><div class="stat-label">الصافي</div></div><div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${ac}</div><div class="stat-label">موظف نشط</div></div><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-value">${managementFY}</div><div class="stat-label">السنة المالية</div></div>`; window._mgmtData={fy:managementFY,te,tr,ts,pf,ac,exCount:ex.length,rvCount:rv.length,slCount:sl.length,empCount:em.length}; }

// ==================== 📊 التحليل البياني ====================
async function loadAnalytics(){ const c=document.getElementById('page-analytics'); c.innerHTML=`<div class="page-header"><h2>📊 التحليل البياني</h2></div><div class="table-toolbar" style="margin-bottom:16px;border:1px solid var(--border);border-radius:14px;padding:12px 16px;background:var(--bg-card);"><label style="font-size:15px;font-weight:700;">📅 السنة المالية:</label><select id="analyticsFYSelect" onchange="refreshAnalytics()">${yearOpts(managementFY)}</select><button class="btn btn-preview" onclick="openPreview('analytics')">📄 معاينة</button></div><div class="table-card"><table><thead><tr><th>الشهر</th><th>عدد الرواتب</th><th>عدد المصاريف</th><th>عدد الإيرادات</th></tr></thead><tbody id="analyticsBody"><tr><td colspan="4">جاري التحميل...</td></tr></tbody></table></div><div class="chart-container"><canvas id="analyticsChart"></canvas></div>`; await refreshAnalytics(); }
async function refreshAnalytics(){ if(!db)return; const fy = document.getElementById('analyticsFYSelect')?.value || managementFY; managementFY = fy; const rng = getFYRange(fy); const [sl, ex, rv] = await Promise.all([getDocs('salaries'), getDocs('expenses'), getDocs('revenues')]); const months=[],salCounts=[],expCounts=[],revCounts=[]; let totalSal=0,totalExp=0,totalRev=0; for(let m=1;m<=12;m++){ const sc=sl.filter(e=>e.date>=rng.start&&e.date<=rng.end&&e.month==m).length,ec=ex.filter(e=>e.date>=rng.start&&e.date<=rng.end&&new Date(e.date).getMonth()+1===m).length,rc=rv.filter(e=>e.date>=rng.start&&e.date<=rng.end&&new Date(e.date).getMonth()+1===m).length; months.push(m);salCounts.push(sc);expCounts.push(ec);revCounts.push(rc);totalSal+=sc;totalExp+=ec;totalRev+=rc; } document.getElementById('analyticsBody').innerHTML=months.map((m,i)=>`<tr><td>${m}</td><td>${salCounts[i]}</td><td>${expCounts[i]}</td><td>${revCounts[i]}</td></tr>`).join(''); setTimeout(()=>{ if(analyticsChart)analyticsChart.destroy(); const ctx=document.getElementById('analyticsChart')?.getContext('2d'); if(!ctx)return; analyticsChart=new Chart(ctx,{type:'bar',data:{labels:months,datasets:[{label:'عدد الرواتب',data:salCounts,backgroundColor:'rgba(79,140,255,0.7)',borderColor:'#4f8cff',borderWidth:1,borderRadius:4},{label:'عدد المصاريف',data:expCounts,backgroundColor:'rgba(255,69,58,0.7)',borderColor:'#ff453a',borderWidth:1,borderRadius:4},{label:'عدد الإيرادات',data:revCounts,backgroundColor:'rgba(52,199,89,0.7)',borderColor:'#34c759',borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#a0a3b1',font:{family:'Cairo',size:12},padding:16}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,color:'#a0a3b1'},grid:{color:'rgba(160,163,177,0.1)'}},x:{ticks:{color:'#a0a3b1',font:{family:'Cairo'}}}}}}); },300); window._analyticsData={fy,months,salCounts,expCounts,revCounts,totalSal,totalExp,totalRev}; }

// ==================== ⚙️ الإعدادات ====================
async function loadSettings(){ const c=document.getElementById('page-settings'),isLight=companySettings.theme==='light'; c.innerHTML=`<div class="page-header"><h2>⚙️ الإعدادات</h2></div><div style="max-width:460px;margin:0 auto"><div class="table-card" style="padding:20px"><div class="form-group"><label>🏢 اسم الشركة</label><input type="text" id="scn" value="${companySettings.name}"></div><div class="form-group"><label>💵 العملة</label><input type="text" id="scur" value="${companySettings.currency}"></div><div class="form-group"><label>🔐 تغيير كلمة المرور</label><input type="password" id="spw" placeholder="أدخل كلمة المرور الجديدة"><div class="password-warning">⚠️ سيتم حفظ كلمة المرور في قاعدة البيانات والاعتماد عليها بدلاً من الافتراضية</div></div><div class="form-group"><label>🎨 المظهر</label><div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span class="icon" id="themeIcon">${isLight?'☀️':'🌙'}</span><span id="themeText">${isLight?'الوضع النهاري':'الوضع الليلي'}</span></div></div><div class="settings-divider"><div class="settings-label">🔐 خيارات متقدمة</div><button class="btn btn-reset btn-block" onclick="resetPasswordToDefault()">🔑 استعادة كلمة المرور الافتراضية</button><button class="btn btn-logout-all btn-block" onclick="logoutAllUsers()">🚪 إلغاء جميع تسجيلات الدخول</button></div><button class="btn btn-blue btn-block" onclick="saveSettings()">💾 حفظ الإعدادات</button></div></div>`; document.getElementById('scn').addEventListener('input',()=>{companySettings.name=document.getElementById('scn').value.trim()||'شركتي';document.getElementById('companyNameDisplay').textContent=companySettings.name;autoSaveSettings();}); document.getElementById('scur').addEventListener('input',()=>{companySettings.currency=document.getElementById('scur').value.trim()||'د.ع';document.getElementById('companyCurrency').textContent=companySettings.currency;autoSaveSettings();}); }
function toggleTheme(){ if(companySettings.theme==='dark'){companySettings.theme='light';document.body.classList.add('light');document.getElementById('themeIcon').textContent='☀️';document.getElementById('themeText').textContent='الوضع النهاري';} else {companySettings.theme='dark';document.body.classList.remove('light');document.getElementById('themeIcon').textContent='🌙';document.getElementById('themeText').textContent='الوضع الليلي';} toast(`✅ تم التبديل`); autoSaveSettings(); }
async function saveSettings(){ companySettings.name=document.getElementById('scn').value.trim()||'شركتي'; companySettings.currency=document.getElementById('scur').value.trim()||'د.ع'; const pw=document.getElementById('spw').value.trim(); if(pw) { await savePasswordToDB(pw); toast('✅ تم حفظ كلمة المرور الجديدة في قاعدة البيانات'); } document.getElementById('companyNameDisplay').textContent=companySettings.name; document.getElementById('companyCurrency').textContent=companySettings.currency; if(db){ try{ const s=await getDocs('settings'); if(s.length>0) await updDoc('settings',s[0].id,{settings:companySettings}); else await addDoc('settings',{settings:companySettings}); } catch(e){ toast('خطأ في حفظ الإعدادات','error'); } } document.getElementById('spw').value = ''; }

// ==================== تصدير Excel ====================
function exportExcel(type){ let data=[],headers=[],title=''; switch(type){ case 'salaries': headers=['#','الموظف','الراتب','المواصلات','المجموع','التاريخ']; data=salariesFiltered.map((e,i)=>[i+1,e.employee_name,e.salary,e.transport,Number(e.salary)+Number(e.transport),e.date]); title='الرواتب'; break; case 'employees': headers=['#','الاسم','المنصب','الراتب','المواصلات','الهاتف','الحالة']; data=employeesFiltered.map((e,i)=>[i+1,e.name,e.position,e.default_salary,e.default_transport,e.phone,e.status]); title='الموظفون'; break; case 'expenses': headers=['#','التاريخ','المبلغ','التفاصيل','ملاحظات']; data=expensesFiltered.map((e,i)=>[i+1,e.date,e.amount,e.details,e.notes]); title='المصاريف'; break; case 'revenues': headers=['#','التاريخ','رقم الإيصال','المبلغ','النوع','ملاحظات']; data=revenuesFiltered.map((e,i)=>[i+1,e.date,e.receipt||'-',e.amount,e.type,e.notes]); title='الإيرادات'; break; } if(data.length===0){toast('لا توجد بيانات','error');return;} const ws=XLSX.utils.aoa_to_sheet([headers,...data]),wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,title); XLSX.writeFile(wb,`${title}_${today()}.xlsx`); toast('✅ تم التصدير'); }

// ==================== نافذة المعاينة والطباعة ====================
function openPreview(type) {
    let data=[],headers=[],title='',totals='';
    const m=type==='salaries'?document.getElementById('salMonth')?.value:type==='expenses'?document.getElementById('expMonth')?.value:type==='revenues'?document.getElementById('revMonth')?.value:'';
    const y=type==='salaries'?document.getElementById('salYear')?.value:type==='expenses'?document.getElementById('expYear')?.value:type==='revenues'?document.getElementById('revYear')?.value:'';
    const fy=type==='management'||type==='analytics'?managementFY:y;

    switch(type) {
        case 'salaries': if(salariesFiltered.length===0){toast('لا توجد بيانات','error');return;} headers=['#','الموظف','الراتب','المواصلات','المجموع','التاريخ']; data=salariesFiltered.map((e,i)=>[i+1,e.employee_name,fmoney(e.salary),fmoney(e.transport),fmoney(Number(e.salary)+Number(e.transport)),e.date]); title=`كشف الرواتب${m?' - شهر '+m:''}`; break;
        case 'employees': if(employeesFiltered.length===0){toast('لا توجد بيانات','error');return;} headers=['#','الاسم','المنصب','الراتب','المواصلات','الهاتف','الحالة']; data=employeesFiltered.map((e,i)=>[i+1,e.name,e.position||'-',fmoney(e.default_salary),fmoney(e.default_transport),e.phone||'-',e.status||'-']); title='قائمة الموظفين'; break;
        case 'expenses': if(expensesFiltered.length===0){toast('لا توجد بيانات','error');return;} headers=['#','التاريخ','المبلغ','التفاصيل','ملاحظات']; data=expensesFiltered.map((e,i)=>[i+1,e.date,fmoney(e.amount),e.details||'-',e.notes||'-']); title=`تقرير المصاريف${m?' - شهر '+m:''}`; break;
        case 'revenues': if(revenuesFiltered.length===0){toast('لا توجد بيانات','error');return;} headers=['#','التاريخ','رقم الإيصال','المبلغ','النوع','ملاحظات']; data=revenuesFiltered.map((e,i)=>[i+1,e.date,e.receipt||'-',fmoney(e.amount),e.type||'-',e.notes||'-']); title=`تقرير الإيرادات${m?' - شهر '+m:''}`; break;
        case 'management': if(!window._mgmtData){toast('لا توجد بيانات','error');return;} headers=[];data=[];title='التقرير الإداري'; break;
        case 'analytics': if(!window._analyticsData){toast('لا توجد بيانات','error');return;} const ad=window._analyticsData; headers=['الشهر','عدد الرواتب','عدد المصاريف','عدد الإيرادات']; data=ad.months.map((m,i)=>[m,ad.salCounts[i],ad.expCounts[i],ad.revCounts[i]]); title=`التحليل البياني - ${ad.fy}`; break;
    }

    let html = `<div class="p-header"><h2>${companySettings.name}</h2><h3>${title}</h3><p>${dateF()}${fy?' | السنة المالية: '+fy:''}</p></div>`;

    if (type==='management' && window._mgmtData) {
        const d=window._mgmtData;
        html += `<table style="margin-bottom:12px;"><tr><th style="width:40%;">البيان</th><th>القيمة</th></tr><tr><td>💰 الإيرادات</td><td>${fmoney(d.tr)} ${companySettings.currency}</td></tr><tr><td>💸 المصاريف</td><td>${fmoney(d.te)} ${companySettings.currency}</td></tr><tr><td>💳 الرواتب</td><td>${fmoney(d.ts)} ${companySettings.currency}</td></tr><tr><td>📊 صافي الربح</td><td style="font-weight:bold;color:${d.pf>=0?'#22c55e':'#ef4444'}">${fmoney(d.pf)} ${companySettings.currency}</td></tr></table><table style="margin-bottom:12px;"><tr><th style="width:40%;">البيان</th><th>القيمة</th></tr><tr><td>👥 الموظفون النشطون</td><td>${d.ac}</td></tr><tr><td>👥 إجمالي الموظفين</td><td>${d.empCount}</td></tr><tr><td>📅 المصاريف</td><td>${d.exCount}</td></tr><tr><td>💰 الإيرادات</td><td>${d.rvCount}</td></tr><tr><td>💳 الرواتب</td><td>${d.slCount}</td></tr></table>`;
    } else if (type==='analytics' && window._analyticsData) {
        const ad=window._analyticsData;
        html += `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${data.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}<tr class="total-row"><td><strong>الإجمالي</strong></td><td>${ad.totalSal}</td><td>${ad.totalExp}</td><td>${ad.totalRev}</td></tr></tbody></table>`;
    } else {
        html += `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${data.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}`;
        if (type==='salaries') {
            const ts=salariesFiltered.reduce((a,e)=>a+Number(e.salary||0),0),tt=salariesFiltered.reduce((a,e)=>a+Number(e.transport||0),0),gt=ts+tt;
            html += `<tr class="total-row"><td colspan="2"><strong>الإجمالي</strong></td><td>${fmoney(ts)} ${companySettings.currency}</td><td>${fmoney(tt)} ${companySettings.currency}</td><td>${fmoney(gt)} ${companySettings.currency}</td><td></td></tr>`;
        } else if (type==='expenses') {
            const te=expensesFiltered.reduce((a,e)=>a+Number(e.amount||0),0);
            html += `<tr class="total-row"><td colspan="2"><strong>الإجمالي</strong></td><td>${fmoney(te)} ${companySettings.currency}</td><td></td><td></td></tr>`;
        } else if (type==='revenues') {
            const trr=revenuesFiltered.reduce((a,e)=>a+Number(e.amount||0),0);
            html += `<tr class="total-row"><td colspan="3"><strong>الإجمالي</strong></td><td>${fmoney(trr)} ${companySettings.currency}</td><td></td><td></td></tr>`;
        }
        html += `</tbody></table>`;
    }
    html += `<div class="p-footer">نظام إدارة الحسابات | ${dateF()}</div>`;
    document.getElementById('previewContent').innerHTML = html;
    document.getElementById('previewOverlay').classList.add('active');
}

function closePreview() { document.getElementById('previewOverlay').classList.remove('active'); }
function printDirect() { window.print(); }
