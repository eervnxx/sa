<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f1119;
            --bg-card: #1a1d28;
            --bg-input: #232734;
            --text: #e4e6f0;
            --text2: #a0a3b1;
            --accent: #4f8cff;
            --green: #34c759;
            --orange: #ff9f0a;
            --red: #ff453a;
            --border: #2a2d3a;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 16px;
        }

        /* ========== تسجيل الدخول ========== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-overlay.hidden { display: none; }
        
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px 40px;
            width: 400px;
            text-align: center;
        }
        .login-box .icon { font-size: 50px; margin-bottom: 15px; }
        .login-box h1 { font-size: 24px; margin-bottom: 5px; }
        .login-box p { color: var(--text2); font-size: 15px; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 15px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
        }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 22px; }

        /* ========== التخطيط ========== */
        .app { display: flex; min-height: 100vh; }
        .app.hidden { display: none; }

        /* ========== السايدبار ========== */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }
        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .sidebar-header .logo { font-size: 40px; }
        .sidebar-header h3 { font-size: 18px; margin: 5px 0; }
        .sidebar-header span { font-size: 13px; color: var(--text2); }
        
        .sidebar-nav { flex: 1; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            color: var(--text2);
            text-decoration: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
        }
        .sidebar-nav a:hover { background: var(--bg-input); color: var(--text); }
        .sidebar-nav a.active { background: rgba(79,140,255,0.15); color: var(--accent); }
        
        .sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            color: var(--red);
            text-decoration: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .sidebar-footer a:hover { background: rgba(255,69,58,0.1); }

        /* ========== المحتوى ========== */
        .main-content {
            flex: 1;
            margin-right: 260px;
            padding: 30px;
        }
        .page { display: none; }
        .page.active { display: block; }
        
        .page-header { margin-bottom: 25px; }
        .page-header h2 { font-size: 28px; font-weight: 800; }

        /* ========== الجداول ========== */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .table-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .table-toolbar input, .table-toolbar select {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
        }
        .table-toolbar input:focus, .table-toolbar select:focus { border-color: var(--accent); }
        .table-toolbar input { flex: 1; min-width: 180px; }
        .table-toolbar select { min-width: 140px; }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-blue { background: var(--accent); color: #fff; }
        .btn-blue:hover { opacity: 0.85; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-orange { background: var(--orange); color: #000; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
        }
        .btn-outline:hover { background: var(--bg-input); color: var(--text); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }

        table { width: 100%; border-collapse: collapse; }
        table thead th {
            background: var(--bg-input);
            color: var(--accent);
            font-size: 15px;
            font-weight: 700;
            padding: 16px 14px;
            border-bottom: 2px solid var(--border);
            text-align: center;
        }
        table tbody td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            text-align: center;
            font-weight: 600;
        }
        table tbody tr:hover { background: rgba(255,255,255,0.02); }
        table tbody td:first-child { color: var(--text2); font-size: 14px; }

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 16px;
            font-weight: 700;
        }
        .table-footer .total { color: var(--accent); font-size: 20px; }

        /* ========== المودال ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 500px;
            max-width: 95vw;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 { font-size: 22px; text-align: center; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 18px; }
        .modal .form-group label { display: block; font-size: 15px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            outline: none;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        /* ========== توست ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            z-index: 300;
            font-size: 16px;
            font-weight: 600;
        }
        .toast.success { border-right: 4px solid var(--green); }
        .toast.error { border-right: 4px solid var(--red); }

        /* ========== احصائيات ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .stat-icon { font-size: 30px; margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 28px; font-weight: 800; }
        .stat-card .stat-label { font-size: 14px; color: var(--text2); margin-top: 4px; }

        /* ========== موبايل ========== */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .table-toolbar { flex-direction: column; align-items: stretch; }
            .table-toolbar input { min-width: auto; }
        }
    </style>
</head>
<body>

<!-- ==================== تسجيل الدخول ==================== -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div class="icon">📊</div>
        <h1>نظام إدارة الحسابات</h1>
        <p>أدخل كلمة المرور للمتابعة</p>
        <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
        <button id="loginBtn">🔐 دخول</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- ==================== التطبيق ==================== -->
<div class="app hidden" id="appLayout">
    
    <!-- السايدبار -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">📊</div>
            <h3 id="companyNameDisplay">شركتي</h3>
            <span id="companyCurrency">د.ع</span>
        </div>
        <nav class="sidebar-nav">
            <a data-page="salaries" class="active"><span>💳</span> الرواتب</a>
            <a data-page="employees"><span>👥</span> الموظفون</a>
            <a data-page="expenses"><span>💸</span> المصاريف</a>
            <a data-page="revenues"><span>💰</span> الإيرادات</a>
            <a data-page="management"><span>📋</span> الإدارة</a>
            <a data-page="settings"><span>⚙️</span> الإعدادات</a>
        </nav>
        <div class="sidebar-footer">
            <a id="logoutBtn"><span>🚪</span> تسجيل الخروج</a>
        </div>
    </aside>

    <!-- المحتوى -->
    <main class="main-content" id="mainContent">
        <div class="page active" id="page-salaries"></div>
        <div class="page" id="page-employees"></div>
        <div class="page" id="page-expenses"></div>
        <div class="page" id="page-revenues"></div>
        <div class="page" id="page-management"></div>
        <div class="page" id="page-settings"></div>
    </main>
</div>

<!-- مودال -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<!-- توست -->
<div class="toast" id="toast" style="display:none;"></div>

<!-- مكتبات -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ==================== إعدادات Firebase ====================
const firebaseConfig = {
  apiKey: "AIzaSyD7r_fU9w6jXwH_RPFOF4_twEfqY6AiVDc",
  authDomain: "system-bng.firebaseapp.com",
  projectId: "system-bng",
  storageBucket: "system-bng.firebasestorage.app",
  messagingSenderId: "708060887067",
  appId: "1:708060887067:web:bf840832ecc52d7f5160be",
  measurementId: "G-C86GMBN7RV"
};

// ==================== متغيرات ====================
let db;
let currentUser = null;
let currentPage = 'salaries';
let companySettings = { name: 'شركتي', currency: 'د.ع' };
let currentSalaryMonth = new Date().getMonth() + 1;
let currentSalaryYear = new Date().getFullYear();

// بيانات
let salariesData = [], salariesFiltered = [];
let employeesData = [], employeesFiltered = [];
let expensesData = [], expensesFiltered = [];
let revenuesData = [], revenuesFiltered = [];

// ==================== دوال مساعدة ====================
function fmoney(num) {
    if (num === null || num === undefined || isNaN(num)) return '0';
    return Number(num).toLocaleString('en-US');
}
function fcurrency(num) { return fmoney(num) + ' ' + companySettings.currency; }
function today() { return new Date().toISOString().split('T')[0]; }
function now() { const d = new Date(); return d.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' }); }
function dateF() { const d = new Date(); return d.toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' }); }

function getFinancialYear(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return m >= 7 ? `${y}-${y+1}` : `${y-1}-${y}`;
}

function getFYRange(label) {
    const y = parseInt(label.split('-')[0]);
    return { start: `${y}-07-01`, end: `${y+1}-06-30` };
}

function monthOpts() {
    let o = '';
    for (let i = 1; i <= 12; i++) o += `<option value="${i}">${i}</option>`;
    return o;
}

function yearOpts(sel = null) {
    let o = '';
    const cy = new Date().getFullYear();
    const cm = new Date().getMonth() + 1;
    const sy = cm >= 7 ? cy : cy - 1;
    for (let y = 2026; y <= 2040; y++) {
        const lbl = `${y}-${y+1}`;
        const s = (sel === lbl) ? 'selected' : ((y === sy && !sel) ? 'selected' : '');
        o += `<option value="${lbl}" ${s}>${lbl}</option>`;
    }
    return o;
}

function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.style.display = 'block';
    clearTimeout(t._t);
    t._t = setTimeout(() => t.style.display = 'none', 3000);
}

function modal(title, html, onSave) {
    const ov = document.getElementById('modalOverlay');
    const mc = document.getElementById('modalContent');
    mc.innerHTML = `
        <h3>${title}</h3>
        <div>${html}</div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
            <button class="btn btn-blue" id="modalSaveBtn">حفظ</button>
        </div>`;
    ov.classList.add('active');
    if (onSave) document.getElementById('modalSaveBtn').addEventListener('click', async () => { await onSave(); });
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function confirmDel(msg) {
    return new Promise((resolve) => {
        const ov = document.getElementById('modalOverlay');
        const mc = document.getElementById('modalContent');
        mc.innerHTML = `
            <h3>⚠️ تأكيد الحذف</h3>
            <p style="text-align:center;font-size:18px;margin:20px 0;">${msg}</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cn">إلغاء</button>
                <button class="btn btn-red" id="cy">تأكيد</button>
            </div>`;
        ov.classList.add('active');
        document.getElementById('cy').addEventListener('click', () => { ov.classList.remove('active'); resolve(true); });
        document.getElementById('cn').addEventListener('click', () => { ov.classList.remove('active'); resolve(false); });
    });
}

// ==================== Firebase ====================
async function addDoc(coll, data) {
    return await db.collection(coll).add({ ...data, created_at: firebase.firestore.FieldValue.serverTimestamp() });
}
async function updDoc(coll, id, data) { await db.collection(coll).doc(id).update(data); }
async function delDoc(coll, id) { await db.collection(coll).doc(id).delete(); }
async function getDocs(coll, orderBy = null, dir = 'desc') {
    let q = db.collection(coll);
    if (orderBy) q = q.orderBy(orderBy, dir);
    const snap = await q.get();
    const data = [];
    snap.forEach(d => data.push({ id: d.id, ...d.data() }));
    return data;
}

// ==================== دخول / خروج ====================
function checkAuth() {
    if (localStorage.getItem('acc_auth') === 'true') {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appLayout').classList.remove('hidden');
        initApp();
    }
}

async function login() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === '7788c') {
        localStorage.setItem('acc_auth', 'true');
        currentUser = { id: 1 };
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appLayout').classList.remove('hidden');
        document.getElementById('loginError').textContent = '';
        await initApp();
        toast('✅ تم تسجيل الدخول بنجاح');
    } else {
        document.getElementById('loginError').textContent = '❌ كلمة المرور غير صحيحة';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}

function logout() {
    localStorage.removeItem('acc_auth');
    currentUser = null;
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('appLayout').classList.add('hidden');
    document.getElementById('passwordInput').value = '';
}

// ==================== تنقل ====================
function goTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
    const el = document.getElementById('page-' + page);
    if (el) el.classList.add('active');
    const nl = document.querySelector(`.sidebar-nav a[data-page="${page}"]`);
    if (nl) nl.classList.add('active');
    currentPage = page;
    loadPage(page);
}

function loadPage(page) {
    switch(page) {
        case 'salaries': loadSalaries(); break;
        case 'employees': loadEmployees(); break;
        case 'expenses': loadExpenses(); break;
        case 'revenues': loadRevenues(); break;
        case 'management': loadManagement(); break;
        case 'settings': loadSettings(); break;
    }
}

// ==================== تهيئة ====================
function initFirebase() {
    try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        console.log('✅ Firebase ready');
        return true;
    } catch (e) { console.error(e); return false; }
}

async function initApp() {
    if (!initFirebase()) { toast('⚠️ فشل اتصال Firebase', 'error'); return; }
    try {
        const d = await getDocs('settings');
        if (d.length > 0 && d[0].settings) companySettings = { ...companySettings, ...d[0].settings };
        document.getElementById('companyNameDisplay').textContent = companySettings.name;
        document.getElementById('companyCurrency').textContent = companySettings.currency;
    } catch (e) {}
    goTo('salaries');
}

// ==================== 💳 الرواتب ====================
async function loadSalaries() {
    const c = document.getElementById('page-salaries');
    c.innerHTML = `
        <div class="page-header"><h2>💳 الرواتب</h2></div>
        <div class="table-card">
            <div class="table-toolbar">
                <input type="text" id="salSearch" placeholder="🔍 بحث...">
                <select id="salMonth">${monthOpts()}</select>
                <select id="salYear">${yearOpts()}</select>
                <button class="btn btn-blue" onclick="openSalaryModal()">➕ إضافة</button>
                <button class="btn btn-green" onclick="importAllEmp()">👥 استيراد الموظفين</button>
                <button class="btn btn-orange" onclick="copyPrevMonth()">📋 نسخ الشهر السابق</button>
                <button class="btn btn-outline" onclick="refreshSalaries()">🔄 تحديث</button>
                <button class="btn btn-outline" onclick="exportExcel('salaries')">📥 Excel</button>
                <button class="btn btn-outline" onclick="printSalaries()">🖨️ طباعة</button>
            </div>
            <table>
                <thead><tr><th>#</th><th>الموظف</th><th>الراتب</th><th>المواصلات</th><th>التاريخ</th><th>الشهر</th><th>ملاحظات</th><th>إجراءات</th></tr></thead>
                <tbody id="salBody"><tr><td colspan="8">جاري التحميل...</td></tr></tbody>
            </table>
            <div class="table-footer">
                <span>عدد: <strong id="salCount">0</strong></span>
                <span>الرواتب: <strong id="salTotal1">0</strong></span>
                <span>المواصلات: <strong id="salTotal2">0</strong></span>
                <span class="total">الإجمالي: <strong id="salGrand">0</strong></span>
            </div>
        </div>`;

    document.getElementById('salSearch').addEventListener('input', filterSalaries);
    document.getElementById('salMonth').addEventListener('change', filterSalaries);
    document.getElementById('salYear').addEventListener('change', filterSalaries);
    await fetchSalaries();
}

async function fetchSalaries() {
    if (!db) return;
    salariesData = await getDocs('salaries', 'date');
    filterSalaries();
}

function filterSalaries() {
    let f = [...salariesData];
    const s = document.getElementById('salSearch')?.value?.toLowerCase() || '';
    const m = document.getElementById('salMonth')?.value || '';
    const y = document.getElementById('salYear')?.value || '';
    if (s) f = f.filter(e => (e.employee_name || '').toLowerCase().includes(s));
    if (m) f = f.filter(e => e.month == parseInt(m));
    if (y) { const r = getFYRange(y); f = f.filter(e => e.date >= r.start && e.date <= r.end); }
    salariesFiltered = f;
    renderSalaries();
}

function renderSalaries() {
    const tb = document.getElementById('salBody');
    const ts = salariesFiltered.reduce((a, e) => a + Number(e.salary || 0), 0);

async function importAllEmp() {

    if (active.length === 0) { toast('لا يوجد موظفون نشطون', 'error'); return; }

    }

    await fetchSalaries();
}

async function copyPrevMonth() {
    let pm = currentSalaryMonth - 1, py = currentSalaryYear;
    if (pm < 1) { pm = 12; py--; }
    const prev = salariesData.filter(s => s.month == pm && s.date && s.date.startsWith(String(py)));
    if (prev.length === 0) { toast('لا توجد بيانات للشهر السابق', 'error'); return; }
    const exist = salariesData.filter(s => s.month == currentSalaryMonth).map(s => s.employee_name);
    let cnt = 0;
    for (const s of prev) {
        if (exist.includes(s.employee_name)) continue;
        await addDoc('salaries', { employee_name: s.employee_name, salary: s.salary, transport: s.transport, date: today(), month: currentSalaryMonth, notes: s.notes || '' });
        cnt++;
    }
    toast(`✅ تم نسخ ${cnt} سجل`);
    await fetchSalaries();
}

    const te = ex.filter(e => e.date >= rng.start && e.date <= rng.end).reduce((a, e) => a + Number(e.amount || 0), 0);
    const tr = rv.filter(e => e.date >= rng.start && e.date <= rng.end).reduce((a, e) => a + Number(e.amount || 0), 0);
    const ts = sl.filter(e => e.date >= rng.start && e.date <= rng.end).reduce((a, e) => a + Number(e.salary || 0) + Number(e.transport || 0), 0);
    const pf = tr - te - ts;
    const ac = em.filter(e => e.status === 'نشط').length;
    
    document.getElementById('mgmtStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value">${fcurrency(tr)}</div><div class="stat-label">الإيرادات</div></div>
        <div class="stat-card"><div class="stat-icon">💸</div><div class="stat-value">${fcurrency(te)}</div><div class="stat-label">المصاريف</div></div>
        <div class="stat-card"><div class="stat-icon">💳</div><div class="stat-value">${fcurrency(ts)}</div><div class="stat-label">الرواتب</div></div>
        <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" style="color:${pf>=0?'var(--green)':'var(--red)'}">${fcurrency(pf)}</div><div class="stat-label">الصافي</div></div>
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${ac}</div><div class="stat-label">موظف نشط</div></div>
        <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-value">${fy}</div><div class="stat-label">السنة المالية</div></div>`;
}

// ==================== ⚙️ الإعدادات ====================
async function loadSettings() {
    const c = document.getElementById('page-settings');
    c.innerHTML = `
        <div class="page-header"><h2>⚙️ الإعدادات</h2></div>
        <div style="max-width:500px;margin:0 auto">
            <div class="table-card" style="padding:24px">
                <div class="form-group"><label>🏢 اسم الشركة</label><input type="text" id="scn" value="${companySettings.name}"></div>
                <div class="form-group"><label>💵 العملة</label><input type="text" id="scur" value="${companySettings.currency}"></div>
                <div class="form-group"><label>🔐 تغيير كلمة المرور</label><input type="password" id="spw" placeholder="اتركه فارغاً"></div>
                <button class="btn btn-blue" onclick="saveSettings()" style="width:100%;padding:14px;font-size:18px">💾 حفظ</button>
            </div>
        </div>`;
}

async function saveSettings() {
    companySettings.name = document.getElementById('scn').value.trim() || 'شركتي';
    companySettings.currency = document.getElementById('scur').value.trim() || 'د.ع';
    const pw = document.getElementById('spw').value.trim();
    if (pw) localStorage.setItem('acc_pw', pw);
    document.getElementById('companyNameDisplay').textContent = companySettings.name;
    document.getElementById('companyCurrency').textContent = companySettings.currency;
    if (db) {
        const s = await getDocs('settings');
        if (s.length > 0) await updDoc('settings', s[0].id, { settings: companySettings });
        else await addDoc('settings', { settings: companySettings });
    }
    toast('✅ تم حفظ الإعدادات');
}

// ==================== تصدير Excel ====================
function exportExcel(type) {
    let data = [], headers = [], title = '';
    switch(type) {
        case 'salaries':
            headers = ['#','الموظف','الراتب','المواصلات','التاريخ','الشهر'];
            data = salariesFiltered.map((e,i) => [i+1, e.employee_name, e.salary, e.transport, e.date, e.month]);
            title = 'الرواتب'; break;
        case 'employees':
            headers = ['#','الاسم','المنصب','الراتب','المواصلات','الهاتف','الحالة'];
            data = employeesFiltered.map((e,i) => [i+1, e.name, e.position, e.default_salary, e.default_transport, e.phone, e.status]);
            title = 'الموظفون'; break;
        case 'expenses':
            headers = ['#','التاريخ','المبلغ','التفاصيل','ملاحظات'];
            data = expensesFiltered.map((e,i) => [i+1, e.date, e.amount, e.details, e.notes]);
            title = 'المصاريف'; break;
        case 'revenues':
            headers = ['#','التاريخ','المبلغ','النوع','ملاحظات'];
            data = revenuesFiltered.map((e,i) => [i+1, e.date, e.amount, e.type, e.notes]);
            title = 'الإيرادات'; break;
    }
    if (data.length === 0) { toast('لا توجد بيانات', 'error'); return; }
    const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, title);
    XLSX.writeFile(wb, `${title}_${today()}.xlsx`);
    toast('✅ تم التصدير إلى Excel');
}
