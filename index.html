<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* نفس الـCSS بالكامل - لم يتغير */
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a14;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.06);--text:#fff;--text2:#8a8aa0;--primary:#c44569;--accent:#cf6a87;--accent-soft:#f1a9a0;--gradient-fire:linear-gradient(180deg,#f1a9a0,#e66767,#c44569,#a33d5a);--font-ar:'Cairo',sans-serif}
        body{font-family:var(--font-ar);background:var(--bg);color:var(--text);padding:12px;min-height:100vh}
        .container{max-width:800px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;border-bottom:1px solid var(--border)}
        .hero{text-align:center;padding:20px 10px}
        .hero h1{font-size:clamp(32px,8vw,52px);font-weight:900}
        .hero h1 .menu-text{background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .search{width:100%;padding:12px 16px;border-radius:50px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;margin:10px 0}
        .cats-bar{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
        .cat-bar-btn{padding:6px 16px;border-radius:50px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;min-height:36px}
        .cat-bar-btn.active{background:var(--primary);color:#fff}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:fadeUp .3s ease}
        .card.off{opacity:.4}
        .card-img-wrap{width:100%;height:140px;overflow:hidden;background:var(--surface)}
        .card img{width:100%;height:100%;object-fit:cover}
        .card-body{padding:10px}
        .card h3{font-size:15px;font-weight:700}
        .card p{font-size:11px;color:var(--text2)}
        .price{font-size:18px;font-weight:800;color:var(--accent-soft)}
        .btn-icon{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center}
        .modal-overlay.show{display:flex}
        .modal-box{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto}
        .form-input{width:100%;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;min-height:42px;margin-bottom:10px}
        .btn{padding:10px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer;min-height:42px}
        .btn-full{width:100%;padding:12px;border-radius:12px}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-outline{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
        .admin-panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;overflow-y:auto;padding:12px}
        .admin-panel.show{display:block}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);padding:10px 20px;border-radius:50px;z-index:2000;font-size:13px}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <header class="header">
        <div><span style="font-size:26px;font-weight:900;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent">MENU</span></div>
        <button class="btn-icon" onclick="openLoginModal()">⚙️</button>
    </header>
    <div class="hero"><h1><span class="menu-text" id="heroTitle">مرحباً</span></h1><p id="heroDesc"></p></div>
    <input type="text" class="search" id="searchInput" placeholder="ابحث عن وجبتك المفضلة..." oninput="handleSearch()">
    <div class="cats-bar" id="catsBar"></div>
    <div id="menuGrid" class="grid"></div>
</div>

<div id="loginModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🔐 دخول المشرف</h3>
        <input type="text" class="form-input" id="loginEmail" placeholder="البريد">
        <input type="password" class="form-input" id="loginPassword" placeholder="كلمة المرور">
        <button class="btn btn-full btn-primary" onclick="handleLogin()">دخول</button>
        <button class="btn btn-full btn-outline" onclick="document.getElementById('loginModal').classList.remove('show')">إلغاء</button>
    </div>
</div>

<div id="adminPanel" class="admin-panel">
    <div style="max-width:800px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;padding:10px;background:var(--surface);border-radius:10px;margin-bottom:12px">
            <h3>⚙️ لوحة تحكم <span id="adminRestaurantName"></span></h3>
            <div style="display:flex;gap:8px">
                <button class="btn btn-primary" onclick="openDishModal()">➕ طبق</button>
                <button class="btn" style="background:#e66767;color:#fff" onclick="forceLogout()">🚪 خروج</button>
                <button class="btn btn-outline" onclick="closeAdmin()">✖</button>
            </div>
        </div>
        <div id="adminDishesList"></div>
    </div>
</div>

<div id="dishModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🍽️ إضافة طبق</h3>
        <input type="hidden" id="dishId">
        <input type="text" class="form-input" id="dishName" placeholder="اسم الطبق">
        <input type="number" class="form-input" id="dishPrice" placeholder="السعر">
        <input type="text" class="form-input" id="dishDesc" placeholder="الوصف">
        <button class="btn btn-full btn-primary" onclick="saveDish()">💾 حفظ</button>
        <button class="btn btn-full btn-outline" onclick="document.getElementById('dishModal').classList.remove('show')">إلغاء</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== صفر مفاتيح في الواجهة ====================
const API = '/api';
const BASE_URL = "https://menu-one-steel.vercel.app";
const DEV_EMAIL = "55", DEV_PASSWORD = "66";

let categories = [], dishes = [], currentRestaurantId = null;
const urlRestaurantId = new URLSearchParams(location.search).get("id");

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.style.transform = 'translateX(-50%) translateY(0)'; setTimeout(() => el.style.transform = 'translateX(-50%) translateY(80px)', 3000); }

// ==================== API Calls ====================
async function apiPost(endpoint, data) {
    const res = await fetch(`${API}/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    return await res.json();
}

// ==================== PUBLIC ====================
async function loadRestaurant() {
    const rid = urlRestaurantId ? parseInt(urlRestaurantId) : null;
    if (!rid) return;
    currentRestaurantId = rid;
    
    const result = await apiPost('get-restaurant', { id: rid });
    if (result.data) {
        categories = result.data.categories || [];
        dishes = result.data.dishes || [];
        renderDishes('all');
        updateCatsBar();
    }
}

function renderDishes(catId) {
    let f = catId === 'all' ? dishes : dishes.filter(d => d.category_id == catId);
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = f.map(d => `
        <div class="card ${!d.is_available?'off':''}">
            <div class="card-img-wrap"><img src="${d.image||'https://placehold.co/400x250/1a1a35/666'}" loading="lazy"></div>
            <div class="card-body"><h3>${d.name}</h3><p>${d.description||''}</p><span class="price">${Number(d.price).toLocaleString('ar-IQ')} د.ع</span></div>
        </div>
    `).join('');
}

function updateCatsBar() {
    document.getElementById('catsBar').innerHTML = ['الكل', ...categories.map(c => c.name)]
        .map(c => `<button class="cat-bar-btn" onclick="renderDishes('${c==='الكل'?'all':categories.find(x=>x.name===c)?.id}')">${c}</button>`).join('');
}

function handleSearch() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return renderDishes('all');
    const results = dishes.filter(d => d.name.toLowerCase().includes(q));
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = results.map(d => `
        <div class="card ${!d.is_available?'off':''}">
            <div class="card-img-wrap"><img src="${d.image||'https://placehold.co/400x250/1a1a35/666'}" loading="lazy"></div>
            <div class="card-body"><h3>${d.name}</h3><p>${d.description||''}</p><span class="price">${Number(d.price).toLocaleString('ar-IQ')} د.ع</span></div>
        </div>
    `).join('');
}

// ==================== ADMIN ====================
function openLoginModal() { document.getElementById('loginModal').classList.add('show'); }
function closeAdmin() { document.getElementById('adminPanel').classList.remove('show'); }
function forceLogout() { localStorage.removeItem('menuSession'); closeAdmin(); toast('👋 تم تسجيل الخروج'); }

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (email === DEV_EMAIL && password === DEV_PASSWORD) {
        toast('👑 دخول المطور');
        return;
    }
    const result = await apiPost('login', { email, password });
    if (result.data) {
        currentRestaurantId = result.data.id;
        localStorage.setItem('menuSession', JSON.stringify({ id: result.data.id, expiry: Date.now() + 86400000 }));
        document.getElementById('loginModal').classList.remove('show');
        document.getElementById('adminPanel').classList.add('show');
        document.getElementById('adminRestaurantName').textContent = result.data.name;
        loadAdminData();
        toast('✅ دخول الأدمن');
    }
}

async function loadAdminData() {
    const result = await apiPost('get-restaurant', { id: currentRestaurantId });
    if (result.data) {
        categories = result.data.categories || [];
        dishes = result.data.dishes || [];
        document.getElementById('adminDishesList').innerHTML = dishes.map(d => `
            <div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border)">
                <span>${d.name} - ${Number(d.price).toLocaleString('ar-IQ')} د.ع</span>
                <button onclick="deleteDish(${d.id})" style="color:#e66767;background:none;border:none;cursor:pointer">🗑️</button>
            </div>
        `).join('');
    }
}

function openDishModal() { document.getElementById('dishModal').classList.add('show'); }

async function saveDish() {
    const name = document.getElementById('dishName').value.trim();
    const price = document.getElementById('dishPrice').value.trim();
    if (!name || !price) return toast('⚠️ أكمل البيانات');
    
    await apiPost('save-dish', {
        restaurant_id: currentRestaurantId,
        name, price,
        description: document.getElementById('dishDesc').value.trim(),
        is_available: true
    });
    document.getElementById('dishModal').classList.remove('show');
    toast('✅ تم الإضافة');
    loadAdminData();
}

async function deleteDish(id) {
    if (!confirm('⚠️ حذف الطبق؟')) return;
    await apiPost('delete-dish', { id });
    toast('🗑️ تم الحذف');
    loadAdminData();
}

// ==================== INIT ====================
loadRestaurant();
</script>
</body>
</html>
